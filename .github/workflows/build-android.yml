name: Build MUFE Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: 웹 자산을 앱 안에 번들 (서버/빌드 파일 제외)
        run: |
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='android' \
            --exclude='node_modules' --exclude='www' --exclude='api' \
            --exclude='*.apk' \
            --exclude='capacitor.config.json' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='MainActivity.java' --exclude='vercel.json' --exclude='.gitignore' \
            --exclude='login.js' --exclude='register.js' --exclude='verify.js' \
            --exclude='verify-delegate.js' --exclude='challenge.js' --exclude='delegate.js' \
            --exclude='_kv.js' --exclude='service-worker.js' --exclude='*.md' \
            --exclude='mufe-electron' --exclude='무폐 이미지' --exclude='*.exe' --exclude='*.dmg' \
            --exclude='*.AppImage' --exclude='*.zip' --exclude='dist' --exclude='out' \
            ./ /tmp/bundle/
          rm -rf www && mkdir -p www && cp -a /tmp/bundle/. www/
          test -f www/index.html || { echo "FAIL: index.html 없음"; exit 1; }
          echo "번들된 항목:"; ls www/ | head -40
          echo "=== www 총 크기 ==="; du -sh www/
          echo "=== 큰 항목 top ==="; du -sh www/* 2>/dev/null | sort -rh | head -10

      - name: 서버 API 호출을 라이브 서버로 자동전환 (번들용)
        run: |
          cat > /tmp/wrapper.html << 'WRAP'
          <script>
          /* [번들] 흰화면 진단줄 + 오래된 서비스워커 정리 */
          (function(){
            function show(m,c){try{var d=document.getElementById('__diag')||document.createElement('div');d.id='__diag';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:2147483647;background:'+(c||'#111')+';color:#fff;font:14px monospace;padding:8px;white-space:pre-wrap;word-break:break-all';d.textContent=m;(document.body||document.documentElement).appendChild(d);}catch(e){}}
            window.onerror=function(m,src,ln){show('오류: '+m+' @'+String(src||'').split('/').pop()+':'+ln,'#b00000');return false;};
            document.addEventListener('DOMContentLoaded',function(){show('JS OK 로딩중...','#007700');setTimeout(function(){var d=document.getElementById('__diag');if(d&&d.textContent.indexOf('JS OK')===0)d.remove();},3500);});
            setTimeout(function(){var b=document.body;if(b&&b.innerText.replace(/\s/g,'').length<3){show('3초: 본문 비어있음 (로드실패 의심)','#b00000');}},3000);
            try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}}catch(e){}
          })();
          /* [번들] API 호출을 라이브 서버로 자동전환 (CORS 열림) */
          (function(){
            var REMOTE='https://mufe-baeksin.com';
            if(!window.fetch)return;
            var of=window.fetch.bind(window);
            window.fetch=function(input,init){
              try{
                var u=(typeof input==='string')?input:(input&&input.url)||'';
                var i=u.indexOf('/api/');
                if(i!==-1&&u.indexOf(REMOTE)===-1){
                  var nu=REMOTE+u.substring(i);
                  input=(typeof input==='string')?nu:new Request(nu,input);
                }
              }catch(e){}
              return of(input,init);
            };
          })();
          </script>
          WRAP
          python3 - << 'PY'
          import pathlib
          w = pathlib.Path("/tmp/wrapper.html").read_text(encoding="utf-8")
          p = pathlib.Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          # 1) 인앱 탈출 스크립트 무력화 (네이티브 WebView가 ;wv) 때문에 Chrome로 탈출→흰화면)
          s = s.replace("(function mufeEscapeInApp(){", "(function mufeEscapeInApp(){ return; /*번들:탈출비활성*/ ", 1)
          # 2) 이미지암호/대문 이미지를 서버에서 로드 (앱 경량화)
          s = s.replace("const MUFE_IMG_DIRS  = ['/무폐 이미지/', '/images/'];", "const MUFE_IMG_DIRS  = ['https://mufe-baeksin.com/무폐 이미지/', 'https://mufe-baeksin.com/images/'];", 1)
          for _pp in ["/무폐 이미지/chaos-000.png.jpeg", "/무폐 이미지/chaos-000.png", "/images/chaos-000.png"]:
              s = s.replace("'" + _pp + "'", "'https://mufe-baeksin.com" + _pp + "'")
              s = s.replace('"' + _pp + '"', '"https://mufe-baeksin.com' + _pp + '"')
          # 3) 진단줄 + API 자동전환 주입
          if "[번들]" not in s:
              s = s.replace("<head>", "<head>\n" + w, 1)
          p.write_text(s, encoding="utf-8")
          assert ("[번들]" in s) and ("탈출비활성" in s), "보정/주입 실패"
          print("OK: 탈출비활성 + 이미지서버화 + 자동전환 완료")
          PY

      - name: Capacitor 설정 (server.url 없음 = 번들 로드)
        run: |
          cat > capacitor.config.json << 'CFG'
          { "appId": "com.mufe.baeksin", "appName": "MUFE 백신", "webDir": "www" }
          CFG

      - name: Capacitor 설치 / 플랫폼 / 동기화
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: FLAG_SECURE + TEE 생체바인딩(#5) + 자체검사
        run: |
          DEST=android/app/src/main/java/com/mufe/baeksin
          mkdir -p "$DEST"
          cat > "$DEST/MainActivity.java" << 'JAVA'
          package com.mufe.baeksin;

          import android.os.Bundle;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.BridgeActivity;
          import java.security.KeyStore;
          import java.security.KeyPairGenerator;
          import java.security.PrivateKey;
          import java.security.PublicKey;
          import java.security.Signature;
          import java.security.spec.ECGenParameterSpec;
          import java.util.concurrent.Executor;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private static final String ALIAS = "mufe_tee_bio_key";
              private boolean firstResume = true;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // 화면 캡처 / 녹화 차단 (약점 #1의 '화면 구멍')
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                  // [#5] TEE 생체 바인딩 브릿지 — JS에서 window.MufeTee 로 호출
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().addJavascriptInterface(new TeeBridge(), "MufeTee");
                      }
                  } catch (Exception e) {}
                  try {
                      new android.app.AlertDialog.Builder(this)
                          .setTitle("성공")
                          .setMessage("MUFE v9 · 화면보안 ON · 생체보안칩(TEE) 준비됨")
                          .setPositiveButton("확인", null)
                          .show();
                  } catch (Exception e) {}
              }

              // [수정] onResume 자동 reload 제거 — 카메라 권한 팝업/멀티태스킹 복귀 시
              //   화면이 reload되어 대문으로 튕기고 진행 중이던 인증/생체 측정이 날아가던 버그 해결.

              // ─────────────────────────────────────────────────────────
              //  [#5] TEE 생체 바인딩 — 보안칩이 키를 쥐고, 생체 인증해야만 서명
              //  서버(passkey.js)가 P-256 공개키로 그 서명을 검증 → 위조 불가
              // ─────────────────────────────────────────────────────────
              public class TeeBridge {
                  // 보안칩에 P-256 키 생성(생체 필수). 공개키(spki, base64) 반환. "OK:..." | "ERR:..."
                  @JavascriptInterface
                  public String genKey() {
                      try {
                          KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                          ks.load(null);
                          if (ks.containsAlias(ALIAS)) {
                              PublicKey p = ks.getCertificate(ALIAS).getPublicKey();
                              return "OK:" + Base64.encodeToString(p.getEncoded(), Base64.NO_WRAP);
                          }
                      } catch (Exception e) {}
                      // StrongBox(전용 보안칩) 우선 시도 → 없으면 일반 TEE 폴백
                      boolean[] tries = { true, false };
                      for (int i = 0; i < tries.length; i++) {
                          try {
                              KeyPairGenerator kpg = KeyPairGenerator.getInstance(
                                  KeyProperties.KEY_ALGORITHM_EC, "AndroidKeyStore");
                              KeyGenParameterSpec.Builder b = new KeyGenParameterSpec.Builder(
                                      ALIAS, KeyProperties.PURPOSE_SIGN)
                                  .setAlgorithmParameterSpec(new ECGenParameterSpec("secp256r1"))
                                  .setDigests(KeyProperties.DIGEST_SHA256)
                                  .setUserAuthenticationRequired(true);   // ← 생체 없이는 키 사용 불가
                              if (tries[i]) {
                                  try { b.setIsStrongBoxBacked(true); } catch (Throwable t) {}
                              }
                              kpg.initialize(b.build());
                              PublicKey p = kpg.generateKeyPair().getPublic();
                              return "OK:" + Base64.encodeToString(p.getEncoded(), Base64.NO_WRAP);
                          } catch (Exception e) {
                              if (i == tries.length - 1) return "ERR:" + e.getMessage();
                          }
                      }
                      return "ERR:unknown";
                  }

                  // challenge에 생체 인증 후 서명. 결과를 window.__mufeTeeCb(cbId, "OK:sig"|"ERR:..") 로 콜백
                  @JavascriptInterface
                  public void sign(final String challenge, final String cbId) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                                  ks.load(null);
                                  PrivateKey pk = (PrivateKey) ks.getKey(ALIAS, null);
                                  if (pk == null) { cb(cbId, "ERR:no-key"); return; }
                                  final Signature sig = Signature.getInstance("SHA256withECDSA");
                                  sig.initSign(pk);
                                  BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                                      .setTitle("MUFE 생체 인증")
                                      .setSubtitle("보안칩 서명")
                                      .setNegativeButtonText("취소")
                                      .build();
                                  Executor ex = ContextCompat.getMainExecutor(MainActivity.this);
                                  BiometricPrompt bp = new BiometricPrompt(MainActivity.this, ex,
                                      new BiometricPrompt.AuthenticationCallback() {
                                          @Override
                                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) {
                                              try {
                                                  Signature s2 = r.getCryptoObject().getSignature();
                                                  s2.update(challenge.getBytes("UTF-8"));
                                                  cb(cbId, "OK:" + Base64.encodeToString(s2.sign(), Base64.NO_WRAP));
                                              } catch (Exception e) { cb(cbId, "ERR:" + e.getMessage()); }
                                          }
                                          @Override
                                          public void onAuthenticationError(int code, CharSequence msg) {
                                              cb(cbId, "ERR:" + msg);
                                          }
                                          @Override
                                          public void onAuthenticationFailed() { /* 1회 불일치 — 재시도 허용 */ }
                                      });
                                  bp.authenticate(info, new BiometricPrompt.CryptoObject(sig));
                              } catch (Exception e) { cb(cbId, "ERR:" + e.getMessage()); }
                          }
                      });
                  }

                  // 이 기기에 보안칩 키가 있는지
                  @JavascriptInterface
                  public boolean hasKey() {
                      try {
                          KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                          ks.load(null);
                          return ks.containsAlias(ALIAS);
                      } catch (Exception e) { return false; }
                  }

                  private void cb(final String cbId, final String result) {
                      final String js = "window.__mufeTeeCb&&window.__mufeTeeCb("
                          + JSONObject.quote(cbId) + "," + JSONObject.quote(result) + ")";
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  if (getBridge() != null && getBridge().getWebView() != null) {
                                      getBridge().getWebView().evaluateJavascript(js, null);
                                  }
                              } catch (Exception e) {}
                          }
                      });
                  }
              }
          }
          JAVA
          # 자체검사: FLAG_SECURE + TEE 브릿지가 모두 들어갔는지
          grep -q "FLAG_SECURE" "$DEST/MainActivity.java" || { echo "FAIL: FLAG_SECURE 없음"; exit 1; }
          grep -q "MufeTee" "$DEST/MainActivity.java" || { echo "FAIL: TEE 브릿지 없음"; exit 1; }
          echo "OK: FLAG_SECURE + TEE 브릿지"

          # androidx.biometric 의존성 추가 (생체 프롬프트 + CryptoObject 서명)
          GRADLE=android/app/build.gradle
          if ! grep -q 'androidx.biometric' "$GRADLE"; then
            sed -i 's#dependencies {#dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"#' "$GRADLE"
            echo "OK: androidx.biometric 의존성 추가"
          fi

          # 권한: 카메라(기존) + 생체(USE_BIOMETRIC)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"
          grep -q 'android.permission.USE_BIOMETRIC' "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' "$MANIFEST"
          echo "=== AndroidManifest 권한 ==="; grep 'uses-permission' "$MANIFEST" || true

      - name: APK 빌드
        run: |
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          SZ=$(stat -c%s "$APK")
          echo "=== APK 크기: $((SZ/1024/1024)) MB ($SZ bytes) ==="
          if [ "$SZ" -gt 99000000 ]; then echo "경고: 100MB 근접 — GitHub 발행 실패 위험"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: MUFE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 릴리스로 발행 (직접 다운로드 · 100MB제한/압축/캐시 없음)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: MUFE 최신 앱
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
