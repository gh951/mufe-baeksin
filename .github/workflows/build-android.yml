name: Build MUFE Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: www placeholder
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><meta charset="utf-8"><title>MUFE</title>' > www/index.html

      - name: Capacitor 설치
        run: npm install
      - name: 안드로이드 추가
        run: npx cap add android
      - name: 동기화
        run: npx cap sync android

      - name: FLAG_SECURE + 표시팝업 + 카메라 + 자체검사
        run: |
          DEST=android/app/src/main/java/com/mufe/baeksin
          mkdir -p "$DEST"
          cat > "$DEST/MainActivity.java" << 'JAVA'
          package com.mufe.baeksin;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                  Toast.makeText(this, "MUFE 화면보안 ON (v3)", Toast.LENGTH_LONG).show();
              }
          }
          JAVA
          echo "===== MainActivity ====="; cat "$DEST/MainActivity.java"
          grep -q "FLAG_SECURE" "$DEST/MainActivity.java" && echo "OK FLAG_SECURE" || { echo FAIL; exit 1; }
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$MANIFEST"

      - name: APK 빌드
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MUFE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK 자동 발행 (사이트/QR 최신화)
        continue-on-error: true
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app-debug.apk
          git commit -m "Auto-publish app-debug.apk" || { echo "변경없음"; exit 0; }
          git push
